version: 1
org: silence-agents-org
# PRIVATE_SINK = private destination resolved outside this public repo (owner-held mapping).
# Destinations per ADR-048 (PROPOSED): docs/ADR-048_routing_destinations.md
rules:
  - tag: PUBLIC_MIT
    dest:
      org: SILENCE-OBJECTS
      repo: PRIVATE_SINK
    via: repository_dispatch
    gate: cargo-lock-ssot
  - tag: RESEARCH_RAW
    dest:
      org: ev-silence-owner
      repo: PRIVATE_SINK  # target repo to be created by Ewa
    via: repository_dispatch
    gate: owner-ack
  - tag: TRADE_SECRET
    dest:
      org: PRIVATE_SINK
    via: none
    gate: halt-if-public
  - tag: SECRET_INFRA
    dest:
      org: ev-silence-owner
      repo: PRIVATE_SINK  # target repo to be created by Ewa
    via: none
    gate: halt-if-public
  - tag: INVALID
    dest:
      org: silence-agents-org
      repo: PRIVATE_SINK
    via: copy
    gate: append-only
forbid:
  - direct_import_from_private
  - inbox_raw_to_foreign_org
  - unpublished_metric_as_fact
  # ADR-048 (PROPOSED): silence-ecosystem is never a destination for PUBLIC_MIT, RESEARCH_RAW, SECRET_INFRA.
  - silence-ecosystem-as-default
